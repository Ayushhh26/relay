name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Type-check + build ─────────────────────────────────────────────
  build:
    name: Type-check & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install module dependencies
        run: npm ci
        working-directory: spacetimedb

      - name: Type-check client
        run: npx tsc --noEmit

      - name: Build client (Vite)
        run: npm run build
        env:
          VITE_SPACETIMEDB_HOST: https://maincloud.spacetimedb.com
          VITE_SPACETIMEDB_DB_NAME: relay-demo

  # ── Job 2: Unit tests (classifyPrompt + server logic) ────────────────────
  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --run

  # ── Job 3: E2E tests (Playwright + local SpacetimeDB) ────────────────────
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install SpacetimeDB CLI
        run: |
          curl -fsSL "https://github.com/clockworklabs/SpacetimeDB/releases/download/v2.4.1/spacetime-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/spacetime.tar.gz
          tar -xzf /tmp/spacetime.tar.gz -C /tmp
          sudo mv /tmp/spacetime /usr/local/bin/spacetime
          spacetime --version

      - name: Install root dependencies
        run: npm ci

      - name: Install module dependencies
        run: npm ci
        working-directory: spacetimedb

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start local SpacetimeDB
        run: spacetime start &
        shell: bash

      - name: Wait for SpacetimeDB to be ready
        run: |
          for i in $(seq 1 30); do
            spacetime server ping local && break || sleep 1
          done

      - name: Publish module to local server
        run: spacetime publish relay-demo --server local --yes

      - name: Generate client bindings
        run: spacetime generate relay-demo --lang typescript --out-dir src/module_bindings --module-path spacetimedb --server local -y

      - name: Build Vite preview bundle
        run: npm run build
        env:
          VITE_SPACETIMEDB_HOST: ws://localhost:3000
          VITE_SPACETIMEDB_DB_NAME: relay-demo

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          VITE_SPACETIMEDB_HOST: ws://localhost:3000
          VITE_SPACETIMEDB_DB_NAME: relay-demo
          PLAYWRIGHT_BASE_URL: http://localhost:4173

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
